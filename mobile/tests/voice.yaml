appId: com.asidefm.app.dev
---
- launchApp
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "tab-account"
- scrollUntilVisible:
    element:
      id: locale-en
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "locale-en"
- scrollUntilVisible:
    element:
      id: email
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "email"
- inputText: "${EMAIL}"
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "send-code"
- scrollUntilVisible:
    element:
      id: code
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "code"
- inputText: "12345678"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: sign-in
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "sign-in"
- extendedWaitUntil:
    visible:
      id: private-library
    timeout: 15000
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "public-library"
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "episode-mobile-sample"
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "hold-to-talk"
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Allow|While using the app|Only this time|OK"
    optional: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "dismiss-error"
    optional: true
- tapOn:
    id: player-options
- tapOn:
    id: followup-0
- tapOn:
    id: close-player-options
- longPressOn:
    id: "hold-to-talk"
- extendedWaitUntil:
    visible: "A short answer"
    timeout: 45000
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "hold"
    optional: true
- takeScreenshot: "voice-answer"
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "resume"
- assertVisible: "Pause"
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "Pause"
- tapOn:
    id: player-options
- tapOn:
    id: followup-3000
- tapOn:
    id: close-player-options
