# iPhone 16 Pro, Files open to Aside Dev's Documents folder with Aside-upload.wav.
# Accept AI consent before opening Files. Use a throttled multi-part fixture.
appId: com.asidefm.app.dev
---
- tapOn:
    point: 18%, 27%
- extendedWaitUntil:
    visible:
      id: cancel-upload
    timeout: 15000
- pressKey: Home
- waitForAnimationToEnd
# Confirm continued parts and completion in the fixture server logs before reopening.
- launchApp:
    stopApp: false
- waitForAnimationToEnd
- assertNotVisible: "Upload cancelled.*"
- takeScreenshot: upload-background-restored
